<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esports Registration Dashboard</title>
<style>
  /* ============================================================
     THEME TOKENS
     ============================================================ */
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    /* sequential blue ramp (heatmap) */
    --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5;
    --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --good:           #0ca30c;
      --critical:       #d03b3b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ---------- header ---------- */
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 1.45rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 0.875rem; margin: 2px 0 0; }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select {
    font: inherit; font-size: 0.8125rem;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 11px; cursor: pointer;
  }
  input[type="search"] {
    font: inherit; font-size: 0.8125rem;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 11px; min-width: 190px;
  }
  input[type="search"]:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  button:hover, select:hover { border-color: var(--baseline); }
  .masked { filter: blur(5px); user-select: none; }
  .status { font-size: 0.8125rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.err { background: var(--critical); }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
  }
  .card h2 { font-size: 0.9375rem; font-weight: 600; margin: 0 0 2px; }
  .card .hint { font-size: 0.8125rem; color: var(--text-muted); margin: 0 0 16px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 2rem; font-weight: 650; line-height: 1.15; margin-top: 4px; letter-spacing: -0.02em; }
  .kpi .note { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-bottom: 16px; }

  /* ---------- bar chart ---------- */
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; }
  .bar-label { font-size: 0.8125rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { display: block; background: var(--grid); border-radius: 4px; height: 14px; position: relative; overflow: hidden; }
  .bar-fill { display: block; background: var(--series-1); height: 100%; border-radius: 0 4px 4px 0; min-width: 3px; transition: width .35s ease; }
  .bar-val { font-size: 0.8125rem; font-variant-numeric: tabular-nums; color: var(--text-primary); min-width: 2ch; text-align: right; }

  /* ---------- heatmap ---------- */
  .hm-scroll { overflow-x: auto; }
  table.hm { border-collapse: separate; border-spacing: 2px; font-size: 0.8125rem; }
  table.hm th { font-weight: 500; color: var(--text-muted); padding: 4px 8px; text-align: left; white-space: nowrap; font-size: 0.75rem; }
  table.hm th.col { text-align: center; }
  table.hm td { text-align: center; padding: 8px 10px; border-radius: 4px; font-variant-numeric: tabular-nums; min-width: 46px; }

  /* ---------- table ---------- */
  .tbl-scroll { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  table.data th { text-align: left; font-weight: 500; color: var(--text-muted); border-bottom: 1px solid var(--baseline); padding: 7px 10px; white-space: nowrap; }
  table.data td { padding: 7px 10px; border-bottom: 1px solid var(--grid); }
  table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr:hover td { background: var(--grid); }

  .legend { display: flex; gap: 8px; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 14px; }
  .legend .swatch { width: 18px; height: 10px; border-radius: 2px; }

  .notice { font-size: 0.8125rem; color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .err-box { border-color: var(--critical); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--grid); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 28px; font-size: 0.75rem; color: var(--text-muted); }
  table.data tr.filler td { color: transparent; }
  table.data tr.filler:hover td { background: none; }
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
  .pager button {
    min-width: 34px; padding: 5px 9px; font-size: 0.8125rem;
    font-variant-numeric: tabular-nums;
  }
  .pager button[aria-current="true"] {
    background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .gap { color: var(--text-muted); padding: 0 2px; font-size: 0.8125rem; }
  .pager .spacer { flex: 1 1 auto; }
  .logobar {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    background: #ffffff; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 20px; margin-bottom: 18px;
  }
  .logobar img { height: 42px; width: auto; display: block; }
  .logobar .sep { width: 1px; align-self: stretch; background: rgba(11,11,11,0.12); }
  @media (max-width: 620px) {
    .logobar { gap: 14px; padding: 10px 12px; }
    .logobar img { height: 28px; }
    .logobar .sep { display: none; }
  }
  .navlink {
    font-size: 0.8125rem; text-decoration: none; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px; display: inline-block;
  }
  .navlink:hover { border-color: var(--baseline); }

  /* ---------- หน้าจอมือถือ ---------- */
  @media (max-width: 620px) {
    body { padding: 16px 12px 48px; font-size: 14px; }
    h1 { font-size: 1.15rem; }
    .sub { font-size: 0.8125rem; }
    header { gap: 10px; }
    .ctl { width: 100%; gap: 8px; }
    .ctl select, .ctl input[type="search"] { flex: 1 1 100%; width: 100%; }
    header .ctl select { order: -1; }
    .ctl .navlink, .ctl button { flex: 0 0 auto; }
    .card { padding: 14px 14px 16px; }
    .card h2 { font-size: 0.9375rem; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 12px 13px; }
    .kpi .value { font-size: 1.6rem; }
    .grid2 { grid-template-columns: 1fr; gap: 12px; }

    /* กราฟแท่ง: ย้ายชื่อขึ้นบรรทัดบน จะได้ไม่ถูกตัด */
    .bar-row { grid-template-columns: 1fr auto; row-gap: 4px; }
    .bar-label { grid-column: 1 / -1; white-space: normal; }

    /* ตารางสรุป: บีบให้แน่นขึ้น */
    table.data th, table.data td { padding: 6px 8px; font-size: 0.75rem; }

    /* รายชื่อผู้สมัคร: เปลี่ยนจากตารางเป็นการ์ดเรียงลง อ่านง่ายกว่าบนจอแคบ */
    #roster thead { display: none; }
    #roster, #roster tbody, #roster tr, #roster td { display: block; width: 100%; }
    #roster tr { padding: 9px 0; border-bottom: 1px solid var(--grid); }
    #roster tr:hover td { background: none; }
    #roster tr.filler { display: none; }
    #roster td { border: none; padding: 1px 0; font-size: 0.8125rem; }
    #roster td:nth-child(1) { display: none; }
    #roster td:nth-child(2) { display: inline; font-weight: 600; font-size: 0.875rem; }
    #roster td:nth-child(3) { display: inline; margin-left: 5px; }
    #roster td:nth-child(4) { color: var(--text-secondary); margin-top: 3px; }
    #roster td:nth-child(5) { color: var(--text-muted); font-size: 0.75rem; }
    .pager { gap: 5px; }
    .pager button { min-width: 30px; padding: 5px 8px; }
    .pager .spacer { flex-basis: 100%; height: 0; }
  }
  [hidden] { display: none !important; }
</style>
</head>

  // เอา ID จาก URL ของไฟล์สาธารณะ: docs.google.com/spreadsheets/d/<ตรงนี้>/edit
  sheetId: '1Sq95ucDfhL-b1zgQSu4IRBmAAb6UL_P4qBsndWzFAgM',

  // ชื่อแท็บในไฟล์สาธารณะ
  sheetName: 'list',
  gid: '',

  // ตำแหน่งคอลัมน์ในแท็บ list (เริ่มนับจาก 0)
  cols: {
    title:  0,   // A คำนำหน้าชื่อ
    name:   1,   // B ชื่อ - นามสกุล (ปิดบังมาจากสูตรในชีตแล้ว)
    game:   2,   // C รายการแข่งขัน
    session:3,   // D เวลา
    year:   98,  // ไม่มีในแท็บนี้
    school: 99   // ไม่มีในแท็บนี้
  },

  // จำนวนรายชื่อต่อหน้า
  pageSize: 25,

  // จำนวนแถวหัวตารางที่ต้องข้าม (ปกติ = 1)
  headerRows: 1,

  refreshSeconds: 60,   // auto-refresh interval
  dedupe: false,        // true = drop exact duplicate rows

  // ---- PRIVACY ----
  // false = ซ่อนตารางรายชื่อทั้งหมด (แนะนำถ้าเว็บเป็น public)
  showNames: true,
  // จำนวนอักษรของนามสกุลที่แสดง (ที่เหลือแทนด้วย ***)
  surnameVisibleChars: 1,
  maskChar: '***' 
};
/* ================================================================== */

const $ = id => document.getElementById(id);

function endpoint() {
  const base = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq`;
  const p = new URLSearchParams({ tqx: 'out:json' });
  if (CONFIG.sheetName) p.set('sheet', CONFIG.sheetName);
  if (CONFIG.gid) p.set('gid', CONFIG.gid);
  p.set('headers', String(CONFIG.headerRows));   // บอก gviz ว่าแถวแรกเป็นหัวตาราง
  p.set('_', Date.now());           // cache-buster
  return `${base}?${p}`;
}

function parseGviz(text) {
  const s = text.indexOf('{'), e = text.lastIndexOf('}');
  if (s < 0 || e < 0) throw new Error('Unexpected response: the sheet is probably not shared publicly.');
  const json = JSON.parse(text.slice(s, e + 1));
  if (json.status === 'error') {
    throw new Error((json.errors || []).map(x => x.detailed_message || x.message).join('; ') || 'Query error');
  }
  const cell = c => (c == null ? '' : (c.f != null ? c.f : c.v));
  const labels = (json.table.cols || []).map(c => String((c && (c.label || c.id)) || '').trim());
  let rows = (json.table.rows || []).map(r => (r.c || []).map(c => String(cell(c) ?? '').trim()));

  // กันเหนียว: ถ้า gviz ยังส่งแถวหัวตารางมาเป็นข้อมูล ให้ตัดทิ้ง
  const looksLikeHeader = r =>
    labels.length && r.some((v, i) => v && labels[i] && v === labels[i]);
  while (rows.length && looksLikeHeader(rows[0])) rows.shift();

  return rows;
}

const clean = v => (v || '').replace(/\s+/g, ' ').trim();

function tally(rows, idx) {
  const m = new Map();
  for (const r of rows) {
    const k = clean(r[idx]) || '(ไม่ระบุ)';
    m.set(k, (m.get(k) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'th'));
}

function drawBars(el, pairs, limit) {
  if (!el) return;
  const data = limit ? pairs.slice(0, limit) : pairs;
  const max = Math.max(1, ...data.map(d => d[1]));
  el.innerHTML = data.map(([label, n]) => `
    <div class="bar-row" title="${esc(label)}: ${n}">
      <span class="bar-label">${esc(label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%"></span></span>
      <span class="bar-val">${n}</span>
    </div>`).join('') || emptyMsg();
}

function emptyMsg() {
  return `<p style="color:var(--text-muted);font-size:.8125rem;margin:0">ไม่มีข้อมูล</p>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const SEQ = ['--seq-100', '--seq-250', '--seq-400', '--seq-500', '--seq-700'];
function heatColor(n, max) {
  if (!n) return 'transparent';
  const i = Math.min(SEQ.length - 1, Math.floor((n / max) * SEQ.length - 1e-9));
  return `var(${SEQ[i]})`;
}

function drawHeatmap(rows) {
  if (!$('heat')) return;
  const games = [...new Set(rows.map(r => clean(r[CONFIG.cols.game]) || '(ไม่ระบุ)'))].sort();
  const sessions = [...new Set(rows.map(r => clean(r[CONFIG.cols.session]) || '(ไม่ระบุ)'))].sort();
  const counts = {};
  let max = 0;
  for (const r of rows) {
    const g = clean(r[CONFIG.cols.game]) || '(ไม่ระบุ)';
    const s = clean(r[CONFIG.cols.session]) || '(ไม่ระบุ)';
    const k = g + '||' + s;
    counts[k] = (counts[k] || 0) + 1;
    if (counts[k] > max) max = counts[k];
  }
  const head = `<tr><th></th>${sessions.map(s => `<th class="col">${esc(s)}</th>`).join('')}</tr>`;
  const body = games.map(g => `<tr><th>${esc(g)}</th>${sessions.map(s => {
    const n = counts[g + '||' + s] || 0;
    const dark = n > max * 0.55;
    return `<td style="background:${heatColor(n, max)};color:${n ? (dark ? '#fff' : '#0b0b0b') : 'var(--text-muted)'}" title="${esc(g)} / ${esc(s)}: ${n}">${n || '-'}</td>`;
  }).join('')}</tr>`).join('');
  $('heat').innerHTML = head + body;
  return { games, sessions, counts };
}

function drawSummary(rows) {
  if (!$('summary')) return;
  const m = new Map();
  for (const r of rows) {
    const k = (clean(r[CONFIG.cols.game]) || '(ไม่ระบุ)') + '||' + (clean(r[CONFIG.cols.session]) || '(ไม่ระบุ)');
    m.set(k, (m.get(k) || 0) + 1);
  }
  const out = [...m.entries()].sort((a, b) => b[1] - a[1]);
  $('summary').tBodies[0].innerHTML = out.map(([k, n]) => {
    const [g, s] = k.split('||');
    return `<tr><td>${esc(g)}</td><td>${esc(s)}</td><td class="num">${n}</td></tr>`;
  }).join('');
}

function drawKpis(rows, all) {
  if (!$('kpis')) return;
  const games = new Set(rows.map(r => clean(r[CONFIG.cols.game])).filter(Boolean));
  const sessions = new Set(rows.map(r => clean(r[CONFIG.cols.session])).filter(Boolean));
  const schools = new Set(rows.map(r => clean(r[CONFIG.cols.school])).filter(Boolean));
  const tiles = [
    { label: 'ยอดสมัครรวม', value: rows.length, note: rows.length === all ? 'ทุกรายการ' : `จากทั้งหมด ${all}` },
    { label: 'รายการแข่งขัน', value: games.size, note: 'competitions' },
    { label: 'รอบเวลา', value: sessions.size, note: 'sessions' },
    { label: 'สถานศึกษา', value: schools.size, note: 'schools (ตามที่กรอก)' }
  ];
  $('kpis').innerHTML = tiles.map(t => `
    <div class="kpi"><div class="label">${esc(t.label)}</div>
    <div class="value">${t.value}</div><div class="note">${esc(t.note)}</div></div>`).join('');
}

let ALL_ROWS = [];

/* "นายสมชาย ใจดี" -> { first: "สมชาย", last: "ใจดี" }
   คำนำหน้า (นาย/นางสาว/ด.ช. ฯลฯ) ถูกตัดออกจากชื่อจริง */
function splitName(r) {
  const title = clean(r[CONFIG.cols.title]);
  let raw = clean(r[CONFIG.cols.name]);
  if (title && raw.startsWith(title)) raw = raw.slice(title.length).trim();
  const parts = raw.split(/\s+/).filter(Boolean);
  if (!parts.length) return { title, first: '', last: '' };
  const first = parts.shift();
  return { title, first, last: parts.join(' ') };
}

/* "ใจดี" -> "ใ***"  (เห็นเฉพาะอักษรตัวแรก) */
function maskSurname(last) {
  if (!last) return '';
  const n = Math.max(0, CONFIG.surnameVisibleChars);
  return [...last].slice(0, n).join('') + CONFIG.maskChar;
}

let PAGE = 1;

function pageButtons(cur, total) {
  /* 1 .. 2 3 [4] 5 6 .. 12  */
  const out = new Set([1, total, cur, cur - 1, cur + 1, cur - 2, cur + 2]);
  const pages = [...out].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
  const html = [];
  pages.forEach((n, i) => {
    if (i && n - pages[i - 1] > 1) html.push('<span class="gap">...</span>');
    html.push(`<button type="button" data-page="${n}" aria-current="${n === cur}">${n}</button>`);
  });
  return html.join('');
}

function drawRoster(rows) {
  if (!$('rosterCard')) return;
  if (!CONFIG.showNames) { $('rosterCard').hidden = true; return; }
  const q = clean($('search').value).toLowerCase();

  const people = rows.map(r => {
    const nm = splitName(r);
    return { ...nm, game: clean(r[CONFIG.cols.game]), session: clean(r[CONFIG.cols.session]) };
  }).filter(p => !q || [p.first, p.game, p.session].some(v => v.toLowerCase().includes(q)));

  people.sort((a, b) =>
    a.game.localeCompare(b.game, 'th') ||
    a.session.localeCompare(b.session, 'th') ||
    a.first.localeCompare(b.first, 'th'));

  const size  = Math.max(1, CONFIG.pageSize);
  const total = Math.max(1, Math.ceil(people.length / size));
  if (PAGE > total) PAGE = total;
  if (PAGE < 1) PAGE = 1;
  const from  = (PAGE - 1) * size;
  const slice = people.slice(from, from + size);

  const tbodyEl = $('roster').tBodies[0];
  tbodyEl.innerHTML = slice.map((p, i) => `<tr>
      <td class="num" style="color:var(--text-muted)">${from + i + 1}</td>
      <td>${esc((p.title ? p.title + ' ' : '') + p.first)}</td>
      <td style="color:var(--text-secondary)">${esc(maskSurname(p.last))}</td>
      <td>${esc(p.game)}</td>
      <td>${esc(p.session)}</td>
    </tr>`).join('')
    || `<tr><td colspan="5" style="color:var(--text-muted)">ไม่พบรายการที่ค้นหา</td></tr>`;

  // เติมแถวว่างในหน้าสุดท้าย ให้ทุกหน้าสูงเท่ากัน เลย์เอาต์จะได้ไม่ขยับ
  if (people.length > size && slice.length < size) {
    tbodyEl.insertAdjacentHTML('beforeend',
      `<tr class="filler"><td colspan="5">&nbsp;</td></tr>`.repeat(size - slice.length));
  }

  $('rosterPager').innerHTML = people.length > size
    ? `<button type="button" data-page="${PAGE - 1}" ${PAGE === 1 ? 'disabled' : ''}>ก่อนหน้า</button>`
      + pageButtons(PAGE, total)
      + `<button type="button" data-page="${PAGE + 1}" ${PAGE === total ? 'disabled' : ''}>ถัดไป</button>`
      + `<span class="spacer"></span><span class="gap">หน้า ${PAGE} จาก ${total}</span>`
    : '';

  const shown = people.length ? `${from + 1}-${from + slice.length}` : '0';
  $('rosterCount').textContent = q || people.length !== rows.length
    ? `แสดง ${shown} จาก ${people.length} รายการที่ค้นพบ (ทั้งหมด ${rows.length} รายการ)`
    : `แสดง ${shown} จาก ${rows.length} รายการ (ปิดบังนามสกุล)`;
}

function render() {
  const pick = $('gameFilter').value;
  const rows = pick ? ALL_ROWS.filter(r => clean(r[CONFIG.cols.game]) === pick) : ALL_ROWS;
  drawRoster(rows);
  drawKpis(rows, ALL_ROWS.length);
  drawBars($('byGame'), tally(rows, CONFIG.cols.game));
  drawBars($('bySession'), tally(rows, CONFIG.cols.session));
  drawBars($('bySchool'), tally(rows, CONFIG.cols.school), 10);
  drawBars($('byYear'), tally(rows, CONFIG.cols.year));
  drawHeatmap(rows);
  drawSummary(rows);
}

function setStatus(msg, ok = true) {
  $('statusText').textContent = msg;
  $('dot').classList.toggle('err', !ok);
}

async function load() {
  setStatus('กำลังโหลด…');
  try {
    if (/PASTE_PUBLIC_SHEET_ID/.test(CONFIG.sheetId))
      throw new Error('ยังไม่ได้ตั้งค่า sheetId: เปิดไฟล์นี้ด้วย text editor แล้วใส่ ID ของไฟล์ชีตสาธารณะใน CONFIG');
    const res = await fetch(endpoint(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}: check that the sheet is shared "Anyone with the link".`);
    let rows = parseGviz(await res.text());

    // drop rows with no competition value (trailing blanks)
    rows = rows.filter(r => clean(r[CONFIG.cols.game]));
    if (CONFIG.dedupe) {
      const seen = new Set();
      rows = rows.filter(r => { const k = r.join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
    }
    ALL_ROWS = rows;

    const sel = $('gameFilter'), keep = sel.value;
    const games = [...new Set(rows.map(r => clean(r[CONFIG.cols.game])))].sort();
    sel.innerHTML = '<option value="">ทุกรายการ / All games</option>' +
      games.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
    if (games.includes(keep)) sel.value = keep;

    $('errBox').hidden = true;
    render();
    setStatus(`อัปเดตล่าสุด ${new Date().toLocaleTimeString('th-TH')} (${rows.length} รายการ)`);
  } catch (e) {
    setStatus('โหลดข้อมูลไม่สำเร็จ', false);
    $('errBox').hidden = false;
    $('errBox').innerHTML = `<strong>Could not load the sheet.</strong><br>${esc(e.message)}<br><br>
      ตรวจสอบว่า: แชร์ชีตเป็น <code>Anyone with the link → Viewer</code>
      และ <code>sheetId</code> ใน CONFIG ถูกต้อง`;
  }
}

$('refreshBtn').addEventListener('click', load);
$('gameFilter').addEventListener('change', () => { PAGE = 1; render(); });
if ($('search')) $('search').addEventListener('input', () => { PAGE = 1; render(); });
if ($('rosterPager')) $('rosterPager').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (!b || b.disabled) return;
  PAGE = Number(b.dataset.page);
  const y = window.scrollY;      // คงตำแหน่งหน้าจอไว้ ไม่ให้เด้ง
  render();
  window.scrollTo({ top: y, behavior: 'instant' });
});
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
});


load();
setInterval(load, CONFIG.refreshSeconds * 1000);
</script>
</body>
</html>
